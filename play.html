<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Draw your face</title>
<style>
  :root{
    --face:#c0c0c0; --hi:#ffffff; --shadow:#808080; --dark:#000080; --ink:#000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#008080;color:var(--ink);
    font-family:'Tahoma','Malgun Gothic','Noto Sans KR',sans-serif;font-size:15px;
    overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--face)}
  .screen.active{display:flex}

  /* Title bar (full width on phone) */
  .titlebar{background:linear-gradient(90deg,var(--dark),#1084d0);color:#fff;
    padding:8px 10px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:15px;flex:0 0 auto}
  .titlebar .icon{width:16px;height:16px;flex:0 0 16px;
    background:linear-gradient(135deg,#ff0 25%,#0f0 25% 50%,#0ff 50% 75%,#f0f 75%);border:1px solid #000}

  /* Canvas area takes the free space */
  .paper-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
  .paper{position:relative;width:100%;height:100%;max-width:100%;max-height:100%;
    background:#fff;border:2px solid; border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}

  .guide{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1/1;transform:translate(-50%,-50%);
    border:2px dashed #a0a0a0;border-radius:50%;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#808080}
  .guide .ko{font-size:clamp(13px,4vw,17px);font-weight:700;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;padding:0 8px}
  .guide .en{font-size:clamp(12px,3.6vw,15px);margin-top:4px;padding:0 8px}
  .guide.hide{display:none}

  /* Bottom tool area (thumb-reachable) */
  .tools{flex:0 0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:6px;
    border-top:2px solid var(--hi);background:var(--face)}
  .row{display:flex;align-items:center;gap:6px}

  .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;flex:1;
    padding:4px;border:2px solid; border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);background:var(--face)}
  .swatch{aspect-ratio:1/1;border:1px solid #000;cursor:pointer;min-width:0}
  .swatch.on{outline:2px solid #000;outline-offset:1px}
  .current{width:44px;height:44px;flex:0 0 44px;border:1px solid #000;background:#000}

  .sizes{display:flex;align-items:center;justify-content:space-around;gap:4px;flex:1;
    padding:4px;border:2px solid; border-color:var(--shadow) var(--hi) var(--hi) var(--shadow)}
  .sizes i{display:block;background:#000;border-radius:50%;cursor:pointer;flex:0 0 auto}
  .sizes i.on{outline:2px solid #000;outline-offset:2px}

  .btn{flex:1 1 0;min-height:48px;padding:8px 6px;font-family:inherit;font-size:16px;font-weight:700;
    background:var(--face);color:#000;cursor:pointer;
    border:2px solid; border-color:var(--hi) #000 #000 var(--hi);box-shadow:inset -1px -1px 0 var(--shadow)}
  .btn:active{border-color:#000 var(--hi) var(--hi) #000}
  .btn:disabled{color:var(--shadow);cursor:default;text-shadow:1px 1px 0 var(--hi)}
  .btn.primary{background:var(--face)}

  /* Name / mood screen */
  .body-pad{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .body-pad label{font-weight:700;font-size:16px}
  .body-pad input{padding:12px;font-size:18px;font-family:inherit;width:100%;background:#fff;
    border:2px solid; border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);user-select:text;-webkit-user-select:text}
  .hint{font-size:13px;color:#333;text-align:center;margin-top:-6px}
  .question{font-size:20px;font-weight:700;text-align:center;font-family:'Malgun Gothic','Noto Sans KR',sans-serif}
  .nav2{display:flex;gap:8px;padding:8px;border-top:2px solid var(--hi)}

  /* Done screen */
  .done{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
  .done h2{font-size:30px}
  .done p{font-size:16px}
  .done .btn{flex:none;padding:10px 22px;min-height:0}
</style>
</head>
<body>

<!-- 1. DRAW -->
<section class="screen active" id="draw">
  <div class="titlebar"><span class="icon"></span>Draw your face (How are you feeling today?)</div>
  <div class="paper-wrap">
    <div class="paper" id="paper">
      <canvas id="board"></canvas>
      <div class="guide" id="guide">
        <div class="ko">원 안에 얼굴을 그려 주세요</div>
        <div class="en">Draw your face inside the circle</div>
      </div>
    </div>
  </div>
  <div class="tools">
    <div class="row">
      <div class="palette" id="palette"></div>
      <div class="current" id="current"></div>
    </div>
    <div class="row">
      <input type="range" id="brushInput" min="2" max="28" step="1" value="9" aria-label="Brush size">
      <div class="sizes" id="sizes"></div>
    </div>
    <div class="row">
      <button class="btn" onclick="goBack()">Back</button>
      <button class="btn" onclick="undo()">Undo</button>
      <button class="btn" onclick="clearAll()">Redraw</button>
    </div>
    <div class="row">
      <button class="btn" id="btnNext" onclick="showScreen('info')" disabled>Next</button>
    </div>
  </div>
</section>

<!-- 2. NAME + MOOD -->
<section class="screen" id="info">
  <div class="titlebar"><span class="icon"></span>Your info</div>
  <div class="body-pad">
    <label for="nameInput">Name / 이름</label>
    <input id="nameInput" maxlength="12" placeholder="Name / 이름">
    <div class="question" style="text-align:left">오늘 기분은 어때?</div>
    <input id="moodInput" maxlength="10" placeholder="Type your mood (up to 10 characters)">
    <div class="hint">Up to 10 characters / 최대 10자</div>
    <div class="question" style="font-size:16px">
      <div>Nice drawing! Now let's introduce your face to your friends.</div>
      <div style="font-family:'Malgun Gothic','Noto Sans KR',sans-serif;margin-top:4px">멋진 그림을 완성했네요! 이제 너의 얼굴을 친구들에게 소개할게.</div>
    </div>
  </div>
  <div class="nav2">
    <button class="btn" onclick="showScreen('draw')">Back</button>
    <button class="btn" id="btnOk" onclick="submitFace()" disabled>OK</button>
  </div>
</section>

<!-- 3. DONE -->
<section class="screen" id="done">
  <div class="titlebar"><span class="icon"></span>Thank you</div>
  <div class="done">
    <h2>Thank you!</h2>
    <p>그려 주셔서 감사합니다 · Thanks for drawing!</p>
    <button class="btn" onclick="resetAll()">Draw again / 다시 그리기</button>
  </div>
</section>

<script>
  /* ---- SETTINGS ---- */
  const COLORS = ['#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080',
                  '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff'];
  const SIZES  = [4, 9, 16, 28];   // 4 brush levels (28 = thick)

  /* ---- Canvas: strokes stored as data so undo never builds up memory ---- */
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  let strokes = [];
  let current = null;
  let color = COLORS[0];
  let brush = SIZES[1];
  const brushInput = document.getElementById('brushInput');
  brushInput.value = brush;
  let drawing = false;

  function resize(){
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }

  function redraw(){
    const r = canvas.getBoundingClientRect();
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,r.width,r.height);
    for (const s of strokes) drawStroke(s);
  }

  function drawStroke(s){
    if (s.points.length < 1) return;
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (s.points.length === 1) {
      ctx.beginPath();
      ctx.arc(s.points[0].x, s.points[0].y, s.width/2, 0, Math.PI*2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    current = { color, width: brush, points: [pos(e)] };
    strokes.push(current);
    updateNext();
    redraw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing || !current) return;
    e.preventDefault();
    current.points.push(pos(e));
    redraw();
  });
  const endStroke = () => { drawing = false; current = null; };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* Back = go to the previous page (e.g. the QR page the participant came from) */
  function goBack(){
    if (window.history.length > 1) window.history.back();
  }

  /* Next is enabled only after at least one stroke exists */
  function updateNext(){
    document.getElementById('btnNext').disabled = strokes.length === 0;
  }

  /* Cancel = undo last stroke */
  function undo(){
    if (strokes.length === 0) return;
    strokes.pop();
    updateNext();
    redraw();
  }

  /* Redraw = clear all */
  function clearAll(){
    strokes = [];
    updateNext();
    redraw();
  }

  /* ---- Palette (classic 16 colors, 8 per row on phone) ---- */
  const palette = document.getElementById('palette');
  const currentBox = document.getElementById('current');
  COLORS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (i === 0 ? ' on' : '');
    d.style.background = c;
    d.onclick = () => {
      color = c;
      currentBox.style.background = c;
      palette.querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));
      d.classList.add('on');
    };
    palette.appendChild(d);
  });
  currentBox.style.background = COLORS[0];

  /* ---- Brush sizes ---- */
  const sizesEl = document.getElementById('sizes');
  function markSize(){
    sizesEl.querySelectorAll('i').forEach((x, i) => x.classList.toggle('on', SIZES[i] === brush));
  }
  SIZES.forEach(s => {
    const d = document.createElement('i');
    d.style.width = d.style.height = (s + 4) + 'px';
    d.onclick = () => {
      brush = s;
      brushInput.value = s;
      markSize();
    };
    sizesEl.appendChild(d);
  });
  markSize();
  brushInput.addEventListener('input', () => {
    brush = Number(brushInput.value);
    markSize();
  });

  /* ---- Mood: free text (max 10 characters). OK stays off until something is written. ---- */
  const moodInput = document.getElementById('moodInput');
  moodInput.addEventListener('input', () => {
    document.getElementById('btnOk').disabled = moodInput.value.trim() === '';
  });

  /* ---- Navigation ---- */
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'draw') setTimeout(resize, 0);
  }

  /* Keep only what is inside the guide circle (70% of the paper, centered).
     Strokes outside the circle are cut off, so they never reach the wall. */
  function getCircleImage(){
    const w = canvas.width, h = canvas.height;
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const o = out.getContext('2d');
    o.fillStyle = '#fff';
    o.fillRect(0, 0, w, h);
    o.save();
    o.beginPath();
    o.arc(w / 2, h / 2, (w * 0.7) / 2, 0, Math.PI * 2);
    o.clip();
    o.drawImage(canvas, 0, 0);
    o.restore();
    return out.toDataURL('image/png');
  }

  /* ---- Submit: replace the TODO with your real-time sync call.
          payload = { name, mood, image } ---- */
  function submitFace(){
    const name = document.getElementById('nameInput').value.trim() || 'Guest';
    const mood = moodInput.value.trim();
    const image = getCircleImage();
    const payload = { name, mood, image };
    console.log('submit', payload.name, payload.mood);   // TODO: send payload to the wall
    showScreen('done');
  }

  function resetAll(){
    clearAll();
    document.getElementById('nameInput').value = '';
    moodInput.value = '';
    document.getElementById('btnOk').disabled = true;
    updateNext();
    showScreen('draw');
  }

  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
</script>
</body>
</html>
