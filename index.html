<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FACE WALL · 큰 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* 큰 화면 — 흰 벽 가득 얼굴들. 새 얼굴이 오면 모두 비켜서 쳐다보고, 가운데서 쏙 그려짐 */
:root{
  --paper:#FFFFFF; --ink:#141418; --sub:#6B6E78; --yellow:#FFD23F; --line:#E7E4DC;
  --display:'Anton','Archivo',sans-serif; --latin:'Archivo','Noto Sans KR',sans-serif; --ko:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
*{ box-sizing:border-box }
[hidden]{ display:none !important }
html,body{ margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font-family:var(--ko) }
canvas{ position:fixed; inset:0; width:100%; height:100%; display:block }
.ov{ position:fixed; z-index:5 }

/* 제목 (관리자에서 켤 때만) */
#title{ left:3.2vmin; top:3vmin; max-width:46vmin; pointer-events:none; background:rgba(255,255,255,.9); padding:2vmin 2.4vmin; border-radius:2vmin }
#title p{ margin:0 0 1vmin; font:700 1.8vmin/1 var(--ko); color:var(--sub) }
#title h1{ margin:0; font:900 5.6vmin/1.12 var(--ko); letter-spacing:-.045em }
#title h1 u{ text-decoration:none; background:linear-gradient(transparent 72%, var(--yellow) 72% 94%, transparent 94%) }
#title .sub{ margin:1.4vmin 0 0; font:500 1.8vmin/1.5 var(--ko); color:var(--sub) }

/* 아래 가운데 QR 배지 (레퍼런스처럼 작게) */
#qrcard{ left:50%; bottom:2.6vmin; transform:translateX(-50%); display:flex; align-items:center; gap:1.6vmin; background:#fff; border-radius:1.8vmin; padding:1.2vmin 2.2vmin 1.2vmin 1.2vmin; box-shadow:0 0 0 1px var(--line), 0 1.4vmin 4vmin rgba(20,20,24,.12) }
#qrcard img{ width:11vmin; height:11vmin; image-rendering:pixelated; display:block }
#qrcard .txt{ display:grid; gap:.6vmin }
#qrcard .brand{ font:400 3.6vmin/1 var(--display); letter-spacing:.04em }
#qrcard .en{ font:600 1.5vmin/1 var(--latin); color:var(--sub) }
#qrcard .how{ font:700 1.7vmin/1.35 var(--ko) }
#qrcard.closed .how{ color:#C2410C }
#count{ font:700 1.5vmin/1 var(--ko); color:var(--sub) }
#count b{ color:var(--ink) }

#empty{ left:50%; top:46%; transform:translate(-50%,-50%); text-align:center; pointer-events:none }
#empty b{ display:block; font:900 4vmin/1.3 var(--ko); letter-spacing:-.03em }
#empty span{ font:500 2vmin/1.5 var(--ko); color:var(--sub) }

#help{ left:2vmin; top:2vmin; font:600 1.3vmin/1.7 var(--ko); color:var(--sub); background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:1.2vmin; padding:1vmin 1.4vmin; max-width:44vmin }
#help kbd{ font:700 1.2vmin/1 var(--latin); border:1px solid var(--line); border-bottom-width:2px; border-radius:.5vmin; padding:.2vmin .5vmin; background:#fff; color:var(--ink) }
#net{ color:#16A34A } #net.off{ color:#DC2626 }
body.clean #help, body.clean #qrcard, body.clean #title{ display:none }
body.notitle #title{ display:none }
body.helpoff #help{ display:none }

/* 오른쪽 아래 저작권 — 누르면 대시보드(비밀번호 화면)가 새 탭으로 열림 */
#copy{ right:2.4vmin; bottom:1.6vmin; font:600 1.3vmin/1.4 var(--latin); color:#A0A3AC; text-align:right; text-decoration:none; cursor:pointer; padding:.6vmin .8vmin; border-radius:.8vmin }
#copy:hover{ color:#141418; background:rgba(20,20,24,.05) }
body.clean #copy{ display:none }
</style>
</head>
<body class="notitle">
<canvas id="c" aria-label="사람들이 그린 얼굴이 모이는 화면"></canvas>

<header class="ov" id="title">
  <p id="tEyebrow"></p>
  <h1><span id="t1"></span><br><u id="t2"></u></h1>
  <p class="sub" id="tSub"></p>
</header>

<a class="ov" id="copy" href="admin.html" target="_blank" rel="noopener" title="대시보드 열기">© 에듀테크리더스 · edu@eduleader.kr</a>

<aside class="ov" id="qrcard">
  <img id="qr" alt="참여 QR 코드">
  <div class="txt">
    <span class="brand">FACE WALL</span>
    <span class="en">draw your face</span>
    <span class="how" id="qrHow">QR 찍고 내 얼굴 그리기</span>
    <span id="count">지금까지 <b id="countN">0</b>명</span>
  </div>
</aside>

<div class="ov" id="empty"><b>첫 번째 얼굴을 기다리고 있어요</b><span>아래 QR을 찍고 그려 보세요</span></div>

<div class="ov" id="help">
  <span id="net">● 연결 중…</span><br>
  <kbd>F</kbd> 전체화면 · <kbd>D</kbd> 연습 얼굴 · <kbd>Q</kbd> QR · <kbd>T</kbd> 제목 · <kbd>-</kbd><kbd>=</kbd> 얼굴 크기 · <kbd>M</kbd> 소리 <span id="snd">켜짐</span> · <kbd>H</kbd> 이 안내 숨기기
</div>

<script type="module">
import { connect, unpack, drawFace, bbox, hash, rng, pageUrl, demoFace, DEMO_NAMES, DEMO_MSGS, LOCAL, isLine } from './core.js';

const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, store = null;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; zones = reserved(); }
addEventListener('resize', resize);

/* =========================================================
   얼굴 하나 = 손떨림 그림 3장(번갈아 보여 줌) + 위치·크기
   ========================================================= */
const FRAMES = 3, RES = 260;
const faces = [], byId = new Map();
let settings = { max: 80, size: 's' }, total = 0, zones = [];
const SIZE = { xs: .1, s: .135, m: .195, l: .27 };   // 화면 짧은 변 대비 얼굴 크기

function makeFace(id, v, arriving) {
  const strokes = unpack(v.s), box = bbox(strokes), h = hash(id), R = rng(h);
  const frames = [];
  for (let i = 0; i < FRAMES; i++) {
    const c = document.createElement('canvas'); c.width = c.height = RES;
    drawFace(c.getContext('2d'), strokes, { size: RES * .92, x: RES * .04, y: RES * .04, box, wobble: 6, seed: h + i * 7919 });
    frames.push(c);
  }
  // 등장할 때: 색칠 먼저, 선(검정·남색)은 나중에
  const order = [...strokes.filter((k) => !isLine(k.c)), ...strokes.filter((k) => isLine(k.c))];
  return {
    id, name: (v.name || '').slice(0, 8), msg: (v.msg || '').slice(0, 12), strokes, order, box, frames,
    phase: R() * 10, speed: .7 + R() * .6, rot: (R() - .5) * .3, scale: .9 + R() * .2,
    x: W * (.1 + R() * .8), y: H * (.1 + R() * .8), s: 0, arriving, lean: 0, bw: 0, bh: 0,
  };
}

/* =========================================================
   자리 잡기 — 얼굴끼리 서로 밀어내서 절대 겹치지 않게 (말풍선 자리까지 포함)
   ========================================================= */
function reserved() {
  const out = [];
  for (const id of ['title', 'qrcard', 'copy']) {
    const el = $(id); if (!el) continue;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) continue;
    const m = 10; out.push({ l: r.left - m, t: r.top - m, r: r.right + m, b: r.bottom + m });
  }
  return out;
}
function faceSize() {   // 설정 크기, 단 사람이 많아 화면에 다 안 들어가면 그만큼만 작게
  const short = Math.min(W, H), n = Math.max(1, faces.filter((f) => !f.arriving).length);
  const want = short * (SIZE[settings.size] || SIZE.s);
  const fit = Math.sqrt(W * H * .42 / n);
  return Math.max(short * .035, Math.min(want, fit));
}
// 말풍선은 얼굴 바로 위 가운데. 크기를 미리 재 둠
function bubbleFont(s) { return Math.max(10, Math.min(18, s * .17)); }
function measureBubble(f) {
  if (!f.msg) { f.bw = f.bh = 0; return; }
  const fs = bubbleFont(f.s); ctx.font = `700 ${fs}px "Noto Sans KR", sans-serif`;
  f.bw = ctx.measureText(f.msg).width + fs * 1.2; f.bh = fs * 1.8;
}
// 얼굴 하나가 차지하는 동그라미들: [얼굴] (+ [말풍선])
function circles(f) {
  const r = f.s / 2, out = [{ x: f.x, y: f.y, r }];
  if (f.bw) out.push({ x: f.x, y: f.y - r - f.bh * .55, r: Math.max(f.bw / 2, f.bh * .7), bubble: true });
  return out;
}
function settle(obstacle) {
  const list = faces.filter((f) => !f.arriving && f.s > 2);
  const gap = Math.min(W, H) * .012;
  // 0) 화면 전체에 고르게 퍼지기 — 가까운 이웃과 살살 거리를 둠 (빈자리가 생기면 천천히 메워짐)
  const spacing = Math.sqrt(W * H / Math.max(1, list.length)) * .92;
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const A = list[i], B = list[j], dx = B.x - A.x, dy = B.y - A.y;
    if (Math.abs(dx) > spacing || Math.abs(dy) > spacing) continue;
    const d = Math.hypot(dx, dy) || .01; if (d >= spacing) continue;
    const k = (spacing - d) * .012 / d;
    A.x -= dx * k; A.y -= dy * k; B.x += dx * k; B.y += dy * k;
  }
  for (let pass = 0; pass < 3; pass++) {
    // 1) 서로 밀어내기
    for (let i = 0; i < list.length; i++) {
      const A = list[i], ca = circles(A);
      for (let j = i + 1; j < list.length; j++) {
        const B = list[j];
        if (Math.abs(A.x - B.x) > (A.s + B.s) * 1.6 + 200 || Math.abs(A.y - B.y) > (A.s + B.s) * 1.6 + 80) continue;
        const cb = circles(B);
        for (const p of ca) for (const q of cb) {
          let dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
          const min = p.r + q.r + gap;
          if (d >= min) continue;
          if (d < .01) { dx = Math.random() - .5; dy = Math.random() - .5; d = Math.hypot(dx, dy); }
          const push = (min - d) / 2 * .6, ux = dx / d, uy = dy / d;
          A.x -= ux * push; A.y -= uy * push; B.x += ux * push; B.y += uy * push;
        }
      }
    }
    // 2) 가운데 새 얼굴 자리(비켜서기)
    if (obstacle && obstacle.r > 0) for (const f of list) {
      for (const c of circles(f)) {
        const dx = c.x - obstacle.x, dy = c.y - obstacle.y, d = Math.hypot(dx, dy) || 1, min = obstacle.r + c.r + gap;
        if (d < min) { const k = (min - d) * .5; f.x += dx / d * k; f.y += dy / d * k; }
      }
    }
    // 3) 화면 밖·QR 카드 위로 못 가게
    for (const f of list) {
      const r = f.s / 2, top = r + (f.bw ? f.bh * 1.1 : 0) + 6;
      f.x = Math.max(r + 6, Math.min(W - r - 6, f.x));
      f.y = Math.max(top, Math.min(H - r - 6, f.y));
      for (const z of zones) {
        const l = f.x - r, rt = f.x + r, t = f.y - top, b = f.y + r;
        if (rt <= z.l || l >= z.r || b <= z.t || t >= z.b) continue;
        const mv = [z.l - rt, z.r - l, z.t - b, z.b - t];          // 왼·오·위·아래로 빠져나가는 거리
        const k = mv.reduce((bi, v, i) => Math.abs(v) < Math.abs(mv[bi]) ? i : bi, 0);
        if (k < 2) f.x += mv[k] * .5; else f.y += mv[k] * .5;
      }
    }
  }
}

/* =========================================================
   새 얼굴 등장 — ① 모두 비켜서 쳐다봄 ② 색이 쏙 ③ 선이 그려짐 ④ 말풍선 ⑤ 그 자리에서 작아지며 무리에 섞임
   ========================================================= */
const queue = []; let spot = null;
function nextSpot(now) {
  if (spot || !queue.length) return;
  const f = queue.shift(), k = queue.length >= 3 ? .45 : 1;
  spot = { f, t0: now, T: { away: 700 * k, blob: 650 * k, line: 1700 * k, hold: 1500 * k, back: 1100 * k } };
  pop(520);
}
const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const back = (t) => { t = Math.min(1, Math.max(0, t)); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function spotState(now, S) {
  const { t0, T } = spot, e = now - t0;
  const a = T.away, b = a + T.blob, l = b + T.line, h = l + T.hold, z = h + T.back;
  const look = e < a ? ease(e / a) : e < h ? 1 : 1 - ease((e - h) / T.back);
  // 가운데 비워 두는 동그라미: 커졌다가, 마지막엔 새 얼굴 크기로 줄어듦
  const fs = faceSize() * spot.f.scale;
  const big = S * .62, small = fs / 2;
  const r = e < a ? big * ease(e / a) : e < h ? big : big + (small - big) * ease((e - h) / T.back);
  return { e, a, b, l, h, z, look, r };
}

/* ---------- 그리기 ---------- */
function bubble(cx, bottom, text, fs) {   // 얼굴 위 가운데, 꼬리는 아래로
  ctx.font = `700 ${fs}px "Noto Sans KR", sans-serif`;
  const w = ctx.measureText(text).width + fs * 1.2, h = fs * 1.8, x = cx - w / 2, y = bottom - h;
  ctx.fillStyle = '#141418';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - fs * .4, y + h - 1); ctx.lineTo(cx, y + h + fs * .5); ctx.lineTo(cx + fs * .4, y + h - 1); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(text, cx, y + h / 2 + 1);
}
function frame(now) {
  requestAnimationFrame(frame);
  nextSpot(now);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  const t = now / 1000, S = Math.min(W, H) * .42, cx = W / 2, cy = H * .45;
  const st = spot ? spotState(now, S) : null;
  const base = faceSize();
  for (const f of faces) { if (!f.arriving) { f.s += (base * f.scale - f.s) * .08; measureBubble(f); } }
  settle(st ? { x: cx, y: cy, r: st.r } : null);
  for (const f of faces) {
    if (f.arriving || f.s < 2) continue;
    let look = 0;
    if (st) {
      const vx = f.x - cx, vy = f.y - cy, d = Math.hypot(vx, vy) || 1;
      look = st.look * (.35 + .65 * Math.max(0, 1 - d / (Math.max(W, H) * .6)));
      f.lean += ((vx < 0 ? 1 : -1) * .35 * look - f.lean) * .15;      // 새 얼굴 쪽으로 고개 기울이기
    } else f.lean *= .9;
    const bob = Math.sin(t * f.speed * 1.5 + f.phase) * f.s * .03 * (1 - look * .8);
    const hop = look ? -Math.abs(Math.sin(t * 9 + f.phase)) * f.s * .05 * look : 0;   // 놀라서 콩콩
    const sway = Math.sin(t * f.speed + f.phase) * .05 * (1 - look);
    ctx.save(); ctx.translate(f.x, f.y + bob + hop); ctx.rotate(f.rot * .5 + sway + f.lean);
    ctx.drawImage(f.frames[Math.floor(now / 170 + f.phase * 3) % FRAMES], -f.s / 2, -f.s / 2, f.s, f.s);
    ctx.restore();
  }
  // 말풍선은 얼굴을 다 그린 뒤 맨 위에 (가려지지 않게)
  for (const f of faces) if (!f.arriving && f.bw && f.s > 2) bubble(f.x, f.y - f.s / 2 - bubbleFont(f.s) * .3 + Math.sin(t * f.speed * 1.5 + f.phase) * f.s * .03, f.msg, bubbleFont(f.s));
  if (st) drawSpot(now, st, S, cx, cy);
}
function drawSpot(now, st, S, cx, cy) {
  const f = spot.f, { e, a, b, l, h, z } = st;
  if (e >= z) { f.arriving = false; f.x = cx; f.y = cy; f.s = faceSize() * f.scale; spot = null; return; }
  if (e < a) return;   // 아직 비켜서는 중
  if (e < h) {
    const nCol = f.order.filter((k) => !isLine(k.c)).reduce((n, k) => n + k.p.length, 0), nAll = f.order.reduce((n, k) => n + k.p.length, 0) || 1;
    const pb = Math.min(1, (e - a) / (b - a)), pl = Math.min(1, Math.max(0, (e - b) / (l - b)));
    const progress = (nCol * ease(pb) + (nAll - nCol) * ease(pl)) / nAll;
    const size = S * (nCol ? back(pb) : 1);
    if (e > l) { ctx.drawImage(f.frames[Math.floor(now / 170) % FRAMES], cx - S / 2, cy - S / 2, S, S); }
    else drawFace(ctx, f.order, { x: cx - size / 2, y: cy - size / 2, size, box: f.box, progress });
    const ta = Math.min(1, Math.max(0, (e - b - (l - b) * .5) / 300));
    if (ta > 0) {
      ctx.globalAlpha = ta;
      bubble(cx, cy - S * .5 - 8, f.msg || `안녕! 나는 ${f.name || '누군가'}`, Math.round(S * .075));
      ctx.font = `900 ${Math.round(S * .085)}px "Noto Sans KR", sans-serif`; ctx.fillStyle = '#141418'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(f.name || '누군가', cx, cy + S * .52);
      ctx.globalAlpha = 1;
    }
    return;
  }
  // ⑤ 그 자리에서 작아짐 → 주변 얼굴들이 다시 모여듦
  const p = ease((e - h) / (z - h)), s = S + (faceSize() * f.scale - S) * p;
  ctx.drawImage(f.frames[Math.floor(now / 170) % FRAMES], cx - s / 2, cy - s / 2, s, s);
}

/* ---------- 소리 ---------- */
let sound = true, ac = null;
function pop(f0) {
  if (!sound) return;
  try {
    ac = ac || new AudioContext(); if (ac.state === 'suspended') return;
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f0 * 2.3, n + .14);
    g.gain.setValueAtTime(.0001, n); g.gain.exponentialRampToValueAtTime(.25, n + .02); g.gain.exponentialRampToValueAtTime(.0001, n + .35);
    o.connect(g).connect(ac.destination); o.start(n); o.stop(n + .4);
  } catch (e) {}
}
addEventListener('pointerdown', () => { try { ac = ac || new AudioContext(); ac.resume(); } catch (e) {} });

/* ---------- 얼굴 추가 · 삭제 ---------- */
function addFace(id, v, arriving) {
  if (byId.has(id) || !v || !v.s) return;
  const f = makeFace(id, v, arriving);
  byId.set(id, f); faces.push(f); total++;
  trim(); counts();
  if (arriving) queue.push(f);
}
function removeFace(id) {
  const f = byId.get(id); if (!f) return;
  byId.delete(id); faces.splice(faces.indexOf(f), 1); total = Math.max(0, total - 1);
  const qi = queue.indexOf(f); if (qi >= 0) queue.splice(qi, 1);
  if (spot && spot.f === f) spot = null;
  counts();
}
function trim() {
  const max = Math.max(5, settings.max | 0 || 80);
  while (faces.length > max) { const i = faces.findIndex((f) => !f.arriving); if (i < 0) break; const [f] = faces.splice(i, 1); byId.delete(f.id); }
}
function counts() { $('empty').hidden = faces.length > 0; $('countN').textContent = total; }

/* ---------- 문구 · QR ---------- */
function applySettings(s) {
  settings = s;
  $('tEyebrow').textContent = s.eyebrow; $('t1').textContent = s.title1; $('t2').textContent = s.title2; $('tSub').textContent = s.sub;
  document.body.classList.toggle('notitle', !s.showTitle);
  $('qrcard').classList.toggle('closed', s.open === false);
  $('qrHow').textContent = s.open === false ? '지금은 잠시 받지 않아요' : 'QR 찍고 내 얼굴 그리기';
  trim(); counts(); requestAnimationFrame(() => { zones = reserved(); });
}
function renderQr() {
  $('copy').href = pageUrl('admin.html');
  const url = pageUrl('play.html');
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); $('qr').src = q.createDataURL(8, 0); } catch (e) {}
}

/* ---------- 키보드 ---------- */
let demoN = 0;
function demo() {
  const seed = (Date.now() + demoN++ * 977) >>> 0, R = rng(seed);
  addFace('demo' + seed, { s: demoFace(seed), name: DEMO_NAMES[Math.floor(R() * DEMO_NAMES.length)], msg: DEMO_MSGS[Math.floor(R() * DEMO_MSGS.length)], at: Date.now() }, true);
}
const ORDER = ['xs', 's', 'm', 'l'];
function bump(d) {   // - / = 키로 얼굴 크기 바꾸기 (관리자 설정에도 저장)
  const i = Math.max(0, Math.min(3, ORDER.indexOf(settings.size || 's') + d)), size = ORDER[i];
  settings = { ...settings, size };
  if (store) store.setSettings({ size }).catch(() => {});
}
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }
  else if (k === 'h') document.body.classList.toggle('helpoff');
  else if (k === 'q') { $('qrcard').hidden = !$('qrcard').hidden; requestAnimationFrame(() => { zones = reserved(); }); }
  else if (k === 't') { document.body.classList.toggle('notitle'); requestAnimationFrame(() => { zones = reserved(); }); }
  else if (k === 'd') demo();
  else if (k === '-') bump(-1);
  else if (k === '=' || k === '+') bump(1);
  else if (k === 'm') { sound = !sound; $('snd').textContent = sound ? '켜짐' : '꺼짐'; }
});

/* ---------- 시작 ---------- */
resize(); renderQr(); requestAnimationFrame(frame);
const qp = new URLSearchParams(location.search);
if (qp.get('demo')) { const n = Math.min(150, +qp.get('demo') || 30); for (let i = 0; i < n; i++) addFace('demoI' + i, { s: demoFace(1000 + i * 31), name: DEMO_NAMES[i % 16], msg: i % 4 === 0 ? DEMO_MSGS[i % 10] : '', at: i }, false); }
try {
  store = await connect();
  store.onConnected((ok) => { $('net').textContent = ok ? (LOCAL ? '● 연습 모드(이 브라우저 안에서만)' : '● 폰 연결 준비됨') : '● 연결 안 됨'; $('net').classList.toggle('off', !ok); });
  store.onSettings(applySettings);
  const initial = new Set(Object.keys(await store.getFaces()));
  store.onFaces((id, v) => addFace(id, v, !initial.has(id)), removeFace);
} catch (e) {
  $('net').textContent = '● 인터넷 연결을 확인해 주세요 · D 키로 연습은 돼요'; $('net').classList.add('off');
}
</script>
</body>
